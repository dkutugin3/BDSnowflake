services:
  postgres:
    image: postgres:16-alpine
    container_name: bdsnowflake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdsnowflake
      POSTGRES_USER: bdsnowflake
      POSTGRES_PASSWORD: bdsnowflake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./исходные данные:/csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdsnowflake -d bdsnowflake"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
